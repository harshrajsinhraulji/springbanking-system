# =====================================================
# Spring Banking System - Application Configuration
# =====================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Information
spring.application.name=Spring Banking System

# =====================================================
# Database Configuration (MySQL - Railway)
# =====================================================
# Railway MySQL Connection Configuration
# These values will be automatically overridden by Railway environment variables if set
# 
# Railway Environment Variables (automatically used if available):
# - MYSQLHOST (Railway private domain)
# - RAILWAY_TCP_PROXY_DOMAIN (Railway public proxy domain)
# - RAILWAY_TCP_PROXY_PORT (Railway public proxy port)
# - MYSQLUSER (default: root)
# - MYSQL_ROOT_PASSWORD (MySQL root password)
# - MYSQL_DATABASE (default: railway)
#
# For local development, update the values below or use environment variables

# Railway MySQL Connection (Public TCP Proxy - for external access)
# Update RAILWAY_TCP_PROXY_DOMAIN and RAILWAY_TCP_PROXY_PORT from your Railway dashboard
# Format: jdbc:mysql://[RAILWAY_TCP_PROXY_DOMAIN]:[RAILWAY_TCP_PROXY_PORT]/railway
spring.datasource.url=jdbc:mysql://${RAILWAY_TCP_PROXY_DOMAIN:switchback.proxy.rlwy.net}:${RAILWAY_TCP_PROXY_PORT:54062}/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=60000&socketTimeout=60000
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:sIIFIeiYvPpvitAhaGGIwldlqieitnYr}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Alternative: Use Railway Private Domain (if running on Railway platform)
# Uncomment below and comment above if deploying on Railway
# spring.datasource.url=jdbc:mysql://${MYSQLHOST:${RAILWAY_PRIVATE_DOMAIN:localhost}}:3306/${MYSQL_DATABASE:railway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=${MYSQLUSER:root}
# spring.datasource.password=${MYSQL_ROOT_PASSWORD:sIIFIeiYvPpvitAhaGGIwldlqieitnYr}

# =====================================================
# JPA/Hibernate Configuration
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true

# SQL Scripts (Optional - for initial data)
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql
# spring.sql.init.schema-locations=classpath:schema.sql

# =====================================================
# Connection Pool Configuration (HikariCP)
# =====================================================
# Increased timeouts for Railway connection
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=60000

# =====================================================
# Logging Configuration
# =====================================================
logging.level.root=INFO
logging.level.com.banking.system=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================================================
# CORS Configuration
# =====================================================
# Configured in CorsConfig.java

# =====================================================
# API Documentation (Swagger/OpenAPI)
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# =====================================================
# Production Notes
# =====================================================
# For production deployment:
# 1. Set spring.jpa.show-sql=false
# 2. Railway environment variables will automatically override database settings
# 3. Configure proper logging levels
# 4. Set up connection pooling appropriately
# 5. Enable SSL for database connections (if available)
# 6. Configure proper CORS origins
