name: "Bug report"
description: Report a problem to help us improve
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do we reproduce the behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: If applicable, add logs or screenshots to help explain your problem.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: App version/commit hash (if known)
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backend (Spring Boot)
        - Frontend (React)
        - CI/CD
        - Docs
      multiple: true


